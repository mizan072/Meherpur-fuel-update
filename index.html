            if(obj.dom && obj.dom.length > 0) {
                const currentHost = window.location.hostname;
                if(currentHost && !obj.dom.includes(currentHost) && currentHost !== "") throw new Error("DOMAIN_LOCKED");
            }

            const s = CryptoJS.enc.Hex.parse(obj.s);
            const i = CryptoJS.enc.Hex.parse(obj.iv);
            const k = CryptoJS.PBKDF2(inputKey, s, { keySize: 256/32, iterations: 2000 });
            
            const decrypted = CryptoJS.AES.decrypt(
                { ciphertext: CryptoJS.enc.Base64.parse(obj.ct) }, k,
                { iv: i, padding: CryptoJS.pad.Pkcs7, mode: CryptoJS.mode.CBC }
            );

            let result = decrypted.toString(CryptoJS.enc.Utf8);
            if(!result) throw new Error("INVALID_KEY");

            if (typeof LZString !== 'undefined') {
                result = LZString.decompressFromBase64(result);
            }

            // Inject the Anti-Copy DRM into the payload if requested
            if(obj.ac) {
                result = antiCopyPayload + result;
            }

            authContainer.style.display = 'none';
            appFrame.style.display = 'block';
            appFrame.srcdoc = result;
            
        } catch(err) {
            let obj = {};
            try { obj = JSON.parse(atob(configRaw)); } catch(e){}
            
            if (obj.sd && err.message === "INVALID_KEY") {
                failedAttempts++;
                if(failedAttempts >= 3) {
                    isLocked = true;
                    document.getElementById('ui-title').textContent = "Security Lockdown";
                    document.getElementById('ui-title').style.color = "var(--error)";
                    document.getElementById('passkey').disabled = true;
                    document.getElementById('submit-btn').disabled = true;
                    errorMsg.textContent = "Maximum attempts reached. Locked.";
                    errorMsg.style.display = 'block';
                    return;
                }
                errorMsg.textContent = "Invalid Key. Attempts remaining: " + (3 - failedAttempts);
            } else {
                errorMsg.textContent = "Access Denied.";
            }
            errorMsg.style.display = 'block';
            setTimeout(() => { if(!isLocked) errorMsg.style.display = 'none'; }, 3000);
        }
    });
})();
</script>
</body>
</html>
