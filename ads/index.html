<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rewarded Ads – 1 Point (Real Ads Only)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 0.75rem;
        }
        .reward-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 1rem;
            padding: 1.5rem 1rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .reward-label {
            color: #cbd5e1;
            font-size: 1rem;
        }
        .reward-amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fbbf24;
            background: rgba(251, 191, 36, 0.15);
            padding: 0.1rem 1.2rem;
            border-radius: 9999px;
            line-height: 1.4;
        }
        #watchBtn {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 1rem 2rem;
            border-radius: 9999px;
            width: 100%;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        #watchBtn:hover:not(:disabled) {
            background: linear-gradient(145deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -8px rgba(37, 99, 235, 0.6);
        }
        #watchBtn:active:not(:disabled) {
            transform: scale(0.97);
        }
        #watchBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        #statusMsg {
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: #94a3b8;
            min-height: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 9999px;
            padding: 0.5rem 1rem;
            transition: all 0.3s ease;
        }
        #statusMsg.success { color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.2); }
        #statusMsg.error   { color: #f87171; border: 1px solid rgba(248, 113, 113, 0.2); }
        #statusMsg.loading { color: #facc15; border: 1px solid rgba(250, 204, 21, 0.2); }
        .footer {
            margin-top: 1.8rem;
            font-size: 0.7rem;
            color: #475569;
        }
        .footer a { color: #64748b; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            background: #475569;
            color: #e2e8f0;
            font-size: 0.6rem;
            padding: 0.2rem 0.7rem;
            border-radius: 9999px;
            margin-top: 0.5rem;
        }
        .badge.live { background: #16a34a; }
        .badge.error-badge { background: #dc2626; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🎬 Watch & Earn</h1>
        <p class="subtitle">Complete a <strong>real ad</strong> → get <strong>1 point</strong></p>

        <div class="reward-box">
            <span class="reward-label">⭐ Your Points</span>
            <span class="reward-amount" id="coinCounter">0</span>
        </div>

        <button id="watchBtn">
            <span>▶</span> Watch Ad
        </button>

        <div id="statusMsg">Ready to earn!</div>
        <div id="modeBadge" class="badge">⏳ Checking SDK…</div>

        <div class="footer">
            Powered by <a href="https://monetag.com" target="_blank">Monetag</a> &nbsp;·&nbsp;
            <a href="https://docs.monetag.com/docs/ad-integration/rewarded-interstitial/" target="_blank">Docs</a>
        </div>
    </div>

    <!-- YOUR UPDATED ZONE: 11161317 -->
    <script src="https://libtl.com/sdk.js" data-zone="11161317" data-sdk="show_11161317"></script>

    <script>
        (function() {
            "use strict";

            // ---- CONFIG ----
            const REWARD_AMOUNT = 1;
            const SIMULATE_IF_SDK_MISSING = false; // 👈 REAL ADS ONLY – no simulation

            // ---- DOM ----
            const watchBtn = document.getElementById('watchBtn');
            const coinDisplay = document.getElementById('coinCounter');
            const statusMsg = document.getElementById('statusMsg');
            const modeBadge = document.getElementById('modeBadge');

            let totalPoints = 0;

            // ---- Helpers ----
            function updateUI() {
                coinDisplay.textContent = totalPoints;
            }

            function setStatus(text, type = '') {
                statusMsg.textContent = text;
                statusMsg.className = '';
                if (type) statusMsg.classList.add(type);
            }

            function setBadge(text, className = '') {
                modeBadge.textContent = text;
                modeBadge.className = 'badge' + (className ? ' ' + className : '');
            }

            // ---- The main ad-watching function (REAL ADS ONLY) ----
            async function watchAd() {
                // Double-check SDK is available before proceeding
                if (typeof show_11161317 !== 'function') {
                    setStatus('❌ SDK not available. Please disable ad blocker or try again.', 'error');
                    console.error('show_11161317 is not defined – SDK blocked or failed to load.');
                    return;
                }

                watchBtn.disabled = true;
                setStatus('Loading real ad…', 'loading');

                try {
                    // 🎯 Show the ACTUAL Monetag rewarded interstitial
                    await show_11161317();

                    // ✅ Promise resolved = user watched the full ad
                    totalPoints += REWARD_AMOUNT;
                    updateUI();
                    setStatus(`✅ +${REWARD_AMOUNT} point earned from real ad!`, 'success');

                } catch (error) {
                    console.error('Real ad error:', error);
                    setStatus('❌ Ad failed. Please try again.', 'error');
                } finally {
                    watchBtn.disabled = false;
                }
            }

            // ---- Initialisation ----
            function init() {
                if (typeof show_11161317 === 'function') {
                    setBadge('✅ Live SDK (real ads)', 'live');
                    console.log('✅ Monetag SDK loaded successfully for zone 11161317.');
                    setStatus('Ready to earn!');
                    watchBtn.disabled = false;
                } else {
                    setBadge('❌ SDK blocked / missing', 'error-badge');
                    setStatus('❌ SDK not loaded. Check ad blocker.', 'error');
                    console.warn('⚠️ SDK not found. Real ads will NOT work. Disable ad blocker or host on a public domain.');
                    // Disable the button since we have NO simulation fallback
                    watchBtn.disabled = true;
                }
                updateUI();
            }

            // ---- Event listener ----
            watchBtn.addEventListener('click', watchAd);

            // ---- Start ----
            init();

        })();
    </script>
</body>
</html>
