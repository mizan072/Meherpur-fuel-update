<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>হিসেবপাতি - আপনার সতেজ আর্থিক চিত্র</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#14b8a6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="হিসেবপাতি">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIiIGZpbGw9IiMxNGI4YTYiPjxyZWN0IHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiByeD0iMTI4Ii8+PHBhdGggZD0iTTI1NiAxNDRsMTEyIDExMmgtODF2MTEyaC02MlYyNTZIMTQ0TDI1NiAxNDR6IiBmaWxsPSIjZmZmIi8+PC9zdmc+">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Hind Siliguri', 'sans-serif'] },
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PWA Setup (Manifest injected via JS) -->
    <script>
        // Generate Dynamic Manifest
        const manifest = {
            "name": "হিসেবপাতি",
            "short_name": "হিসেবপাতি",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#f8fafc",
            "theme_color": "#14b8a6",
            "description": "আপনার দৈনন্দিন আয়-ব্যয় এবং দেনা-পাওনার হিসাব",
            "icons": [{
                "src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIiIGZpbGw9IiMxNGI4YTYiPjxyZWN0IHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiByeD0iMTI4Ii8+PHBhdGggZD0iTTI1NiAxNDRsMTEyIDExMmgtODF2MTEyaC02MlYyNTZIMTQ0TDI1NiAxNDR6IiBmaWxsPSIjZmZmIi8+PC9zdmc+",
                "sizes": "512x512",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestUrl;
        document.head.appendChild(link);

        // Note: Dynamic Service Worker via Blob URL has been removed because modern browsers 
        // block it for security reasons (causing the "URL protocol is not supported" error).
        // The app will still function as a standalone web app and support "Add to Homescreen".
    </script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        @keyframes float {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-5px) rotate(-3deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .animate-spin-slow { animation: spin-slow 2s linear infinite; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-teal-100 pb-safe">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ------------------ GOOGLE SHEET API URL ------------------
        const API_URL = "https://script.google.com/macros/s/AKfycbwR-zU9JnCsC4wc4Z9HFLvc7SXac3U9VymLudHJ3WIcZZf0-zWWb9mmiXHgJcjtSasYTQ/exec";

        // --- SVG Icons (Replaced Lucide with Inline SVGs for single file support) ---
        const SvgIcon = ({ size = 24, strokeWidth = 2, className = "", children }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Activity: (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></SvgIcon>,
            Wallet: (p) => <SvgIcon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></SvgIcon>,
            Bell: (p) => <SvgIcon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></SvgIcon>,
            ArrowUpRight: (p) => <SvgIcon {...p}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></SvgIcon>,
            ArrowDownRight: (p) => <SvgIcon {...p}><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></SvgIcon>,
            ReceiptText: (p) => <SvgIcon {...p}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></SvgIcon>,
            HandCoins: (p) => <SvgIcon {...p}><path d="M11 15h2a2 2 0 1 0 0-4h-3c-1 0-2-1-2-2s1-2 2-2h3"/><path d="M11 15v2"/><path d="M13 7v2"/><path d="M14.99 18a8.87 8.87 0 0 1-5.61-2l-1.39-1.4c-1.35-1.35-3.38-1.52-4.93-.41a2 2 0 0 0-.41 3.03l6.57 6.64A8.87 8.87 0 0 0 14.99 24"/><path d="M14.99 18h7.62a1.39 1.39 0 0 0 1.29-1.92L21 9"/></SvgIcon>,
            Plus: (p) => <SvgIcon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>,
            Trash2: (p) => <SvgIcon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SvgIcon>,
            CalendarDays: (p) => <SvgIcon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></SvgIcon>,
            Users: (p) => <SvgIcon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></SvgIcon>,
            User: (p) => <SvgIcon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></SvgIcon>,
            X: (p) => <SvgIcon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></SvgIcon>,
            FileText: (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></SvgIcon>,
            Loader: (p) => <SvgIcon {...p} className={`animate-spin-slow ${p.className || ""}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></SvgIcon>
        };

        function App() {
            // --- State ---
            const [activeTab, setActiveTab] = useState('transactions'); 
            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [isDebtModalOpen, setIsDebtModalOpen] = useState(false);
            
            const [transactions, setTransactions] = useState([]);
            const [debts, setDebts] = useState([]);
            
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [apiError, setApiError] = useState("");

            // --- Fetch Data from Google Sheet ---
            const fetchData = async () => {
                setIsLoading(true);
                setApiError("");
                try {
                    const response = await fetch(API_URL);
                    const text = await response.text();
                    
                    try {
                        const data = JSON.parse(text);
                        setTransactions(data.transactions || []);
                        setDebts(data.debts || []);
                    } catch (parseError) {
                        console.error("JSON Parse Error. The API returned HTML instead of JSON:", text.substring(0, 150));
                        setApiError("গুগল শিট থেকে ডেটা লোড করা যাচ্ছে না। অনুগ্রহ করে নিশ্চিত করুন যে আপনার Apps Script 'Who has access: Anyone' দিয়ে Deploy করা হয়েছে।");
                        setTransactions([]);
                        setDebts([]);
                    }
                } catch (error) {
                    console.error("Error fetching data:", error);
                    setApiError("ইন্টারনেট সংযোগ বা সার্ভার সমস্যা।");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            // --- Helper to Send Data to Google Sheet ---
            const postToGoogleSheet = async (action, data) => {
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        // text/plain avoids CORS preflight issues with Apps Script
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, data })
                    });
                } catch (error) {
                    console.error("Sync error:", error);
                    alert("ডেটা সংরক্ষণ করতে সমস্যা হয়েছে!");
                }
            };

            // --- Calculations ---
            const { totalIncome, totalExpense, balance } = useMemo(() => {
                let inc = 0, exp = 0;
                transactions.forEach(t => {
                    if (t.type === 'income') inc += t.amount;
                    else exp += t.amount;
                });
                return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
            }, [transactions]);

            const { totalOwedToMe, totalIOwe } = useMemo(() => {
                let owed = 0, iOwe = 0;
                debts.forEach(d => {
                    if (d.type === 'receivable') owed += d.amount;
                    else iOwe += d.amount;
                });
                return { totalOwedToMe: owed, totalIOwe: iOwe };
            }, [debts]);

            // --- Handlers (Optimistic UI) ---
            const handleAddTransaction = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const formData = new FormData(e.target);
                const newTransaction = {
                    id: Date.now().toString(),
                    type: formData.get('type'),
                    amount: parseFloat(formData.get('amount')),
                    description: formData.get('description'),
                    date: formData.get('date'),
                };
                
                // Optimistic Update
                setTransactions([newTransaction, ...transactions]);
                setIsTransactionModalOpen(false);
                
                // Background Sync
                await postToGoogleSheet("addTransaction", newTransaction);
                setIsSaving(false);
            };

            const handleAddDebt = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const formData = new FormData(e.target);
                const newDebt = {
                    id: Date.now().toString(),
                    type: formData.get('type'),
                    person: formData.get('person'),
                    amount: parseFloat(formData.get('amount')),
                    description: formData.get('description'),
                    date: formData.get('date'),
                };
                
                setDebts([newDebt, ...debts]);
                setIsDebtModalOpen(false);
                
                await postToGoogleSheet("addDebt", newDebt);
                setIsSaving(false);
            };

            const deleteTransaction = async (id) => {
                if(!confirm("আপনি কি এই রেকর্ডটি মুছে ফেলতে চান?")) return;
                setTransactions(transactions.filter(t => t.id !== id));
                await postToGoogleSheet("deleteTransaction", { id });
            };

            const deleteDebt = async (id) => {
                if(!confirm("আপনি কি এই রেকর্ডটি মুছে ফেলতে চান?")) return;
                setDebts(debts.filter(d => d.id !== id));
                await postToGoogleSheet("deleteDebt", { id });
            };

            // --- Utility ---
            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('bn-BD', { style: 'currency', currency: 'BDT', minimumFractionDigits: 0 }).format(amount);
            };

            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString('bn-BD', { month: 'short', day: 'numeric', year: 'numeric' });
            };

            // --- Modals ---
            const TransactionModal = () => (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
                    <div className="bg-white rounded-t-[2rem] sm:rounded-[2rem] w-full max-w-md overflow-hidden shadow-2xl animate-in slide-in-from-bottom-full duration-300 max-h-[90vh] overflow-y-auto border border-slate-100">
                        <div className="sticky top-0 bg-white/95 backdrop-blur-md flex justify-between items-center p-6 border-b border-slate-100 z-10">
                            <h2 className="text-xl font-bold text-slate-800">নতুন লেনদেন</h2>
                            <button onClick={() => setIsTransactionModalOpen(false)} className="p-2 bg-slate-50 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-all">
                                <Icons.X size={20} strokeWidth="2" />
                            </button>
                        </div>
                        <form onSubmit={handleAddTransaction} className="p-6 space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">ধরন</label>
                                <div className="grid grid-cols-2 gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="expense" defaultChecked className="peer sr-only" />
                                        <div className="flex items-center justify-center gap-2 py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-rose-500 peer-checked:text-white peer-checked:shadow-md transition-all">
                                            <Icons.ArrowDownRight size={18} /> খরচ
                                        </div>
                                    </label>
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="income" className="peer sr-only" />
                                        <div className="flex items-center justify-center gap-2 py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-teal-500 peer-checked:text-white peer-checked:shadow-md transition-all">
                                            <Icons.ArrowUpRight size={18} /> আয়
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">পরিমাণ</label>
                                <div className="relative group">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">৳</span>
                                    <input type="number" name="amount" step="1" required placeholder="০.০০" className="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition-all text-lg font-bold text-slate-800" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">বিবরণ</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.FileText size={18} /></span>
                                    <input type="text" name="description" required placeholder="যেমন: বাজার খরচ" className="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition-all font-medium text-slate-800" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">তারিখ</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.CalendarDays size={18} /></span>
                                    <input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-teal-500/10 focus:border-teal-500 outline-none transition-all font-medium text-slate-800" />
                                </div>
                            </div>
                            <button type="submit" disabled={isSaving} className="w-full bg-teal-500 text-white py-4 rounded-2xl font-bold text-lg hover:bg-teal-600 active:scale-[0.98] transition-all mt-6 shadow-md shadow-teal-500/20 disabled:opacity-50">
                                {isSaving ? "সংরক্ষণ হচ্ছে..." : "সেভ করুন"}
                            </button>
                        </form>
                    </div>
                </div>
            );

            const DebtModal = () => (
                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
                    <div className="bg-white rounded-t-[2rem] sm:rounded-[2rem] w-full max-w-md overflow-hidden shadow-2xl animate-in slide-in-from-bottom-full duration-300 max-h-[90vh] overflow-y-auto border border-slate-100">
                        <div className="sticky top-0 bg-white/95 backdrop-blur-md flex justify-between items-center p-6 border-b border-slate-100 z-10">
                            <h2 className="text-xl font-bold text-slate-800">দেনা / পাওনা যোগ</h2>
                            <button onClick={() => setIsDebtModalOpen(false)} className="p-2 bg-slate-50 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-all">
                                <Icons.X size={20} strokeWidth="2" />
                            </button>
                        </div>
                        <form onSubmit={handleAddDebt} className="p-6 space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">কে কাকে টাকা দেবে?</label>
                                <div className="grid grid-cols-2 gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="payable" defaultChecked className="peer sr-only" />
                                        <div className="text-center py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-rose-500 peer-checked:text-white peer-checked:shadow-md transition-all">
                                            আমি দেবো (দেনা)
                                        </div>
                                    </label>
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="receivable" className="peer sr-only" />
                                        <div className="text-center py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-cyan-500 peer-checked:text-white peer-checked:shadow-md transition-all">
                                            আমি পাবো (পাওনা)
                                        </div>
                                    </label>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">ব্যক্তির নাম</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.User size={18} /></span>
                                    <input type="text" name="person" required placeholder="যেমন: রহিম" className="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-cyan-500/10 focus:border-cyan-500 outline-none transition-all font-medium text-slate-800" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">পরিমাণ</label>
                                <div className="relative group">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-lg">৳</span>
                                    <input type="number" name="amount" step="1" required placeholder="০.০০" className="w-full pl-10 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-cyan-500/10 focus:border-cyan-500 outline-none transition-all text-lg font-bold text-slate-800" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">কারণ / বিবরণ</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.FileText size={18} /></span>
                                    <input type="text" name="description" placeholder="যেমন: ধার" className="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-cyan-500/10 focus:border-cyan-500 outline-none transition-all font-medium text-slate-800" />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">তারিখ</label>
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.CalendarDays size={18} /></span>
                                    <input type="date" name="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full pl-11 pr-4 py-3.5 bg-white border-2 border-slate-200 rounded-2xl focus:ring-4 focus:ring-cyan-500/10 focus:border-cyan-500 outline-none transition-all font-medium text-slate-800" />
                                </div>
                            </div>
                            <button type="submit" disabled={isSaving} className="w-full bg-cyan-500 text-white py-4 rounded-2xl font-bold text-lg hover:bg-cyan-600 active:scale-[0.98] transition-all mt-6 shadow-md shadow-cyan-500/20 disabled:opacity-50">
                                {isSaving ? "সংরক্ষণ হচ্ছে..." : "সেভ করুন"}
                            </button>
                        </form>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col relative">
                    
                    {/* Header */}
                    <header className="px-5 pt-8 pb-4 max-w-2xl mx-auto w-full flex items-center justify-between relative z-10">
                        <div className="flex items-center gap-3">
                            <div className="w-11 h-11 bg-teal-500 text-white rounded-xl flex items-center justify-center shadow-md shadow-teal-500/20 transform rotate-3 animate-float border border-teal-400">
                                <Icons.Activity size={22} strokeWidth="2.5" className="-rotate-3" />
                            </div>
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800 leading-tight">হিসেবপাতি</h1>
                                <p className="text-slate-500 text-sm font-medium">আপনার দৈনন্দিন আর্থিক চিত্র</p>
                            </div>
                        </div>
                        <button onClick={fetchData} className="w-11 h-11 bg-white rounded-xl flex items-center justify-center border border-slate-200 shadow-sm text-slate-500 hover:bg-slate-50 hover:text-teal-600 transition-all">
                            {isLoading ? <Icons.Loader size={20} strokeWidth="2.5" className="text-teal-500" /> : <Icons.Bell size={20} />}
                        </button>
                    </header>

                    {/* Main Container */}
                    <main className="flex-grow w-full max-w-2xl mx-auto px-4 sm:px-5 pb-10 relative z-10">
                        
                        {apiError && (
                            <div className="bg-rose-50 text-rose-600 text-sm font-medium p-4 rounded-2xl border border-rose-200 mb-6 flex items-start gap-2 shadow-sm">
                                <Icons.Activity size={18} className="shrink-0 mt-0.5" />
                                <div>{apiError}</div>
                            </div>
                        )}

                        {/* Main Balance Card */}
                        <section className="bg-gradient-to-r from-teal-500 to-cyan-500 rounded-[2rem] p-6 sm:p-8 text-white shadow-lg shadow-teal-500/20 border border-teal-400 relative overflow-hidden mb-8">
                            <div className="absolute top-0 right-0 w-64 h-64 bg-white/20 rounded-full blur-3xl -mr-20 -mt-20 mix-blend-overlay"></div>
                            
                            <div className="relative z-10">
                                <div className="flex items-center gap-2 text-teal-50 mb-2 font-medium">
                                    <Icons.Wallet size={18} />
                                    <span>বর্তমান মোট ব্যালেন্স</span>
                                </div>
                                
                                <div className="text-4xl sm:text-5xl font-bold tracking-tight mb-8 text-white">
                                    {isLoading ? '...' : formatCurrency(balance)}
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/20">
                                        <div className="flex items-center gap-1.5 text-white mb-1">
                                            <div className="bg-white/20 p-1 rounded-md"><Icons.ArrowUpRight size={14} strokeWidth="2.5" /></div>
                                            <span className="text-sm font-semibold uppercase tracking-wider text-teal-50">মোট আয়</span>
                                        </div>
                                        <div className="text-xl sm:text-2xl font-bold text-white">{isLoading ? '...' : formatCurrency(totalIncome)}</div>
                                    </div>
                                    <div className="bg-white/10 backdrop-blur-md rounded-2xl p-4 sm:p-5 border border-white/20">
                                        <div className="flex items-center gap-1.5 text-white mb-1">
                                            <div className="bg-white/20 p-1 rounded-md"><Icons.ArrowDownRight size={14} strokeWidth="2.5" /></div>
                                            <span className="text-sm font-semibold uppercase tracking-wider text-teal-50">মোট ব্যয়</span>
                                        </div>
                                        <div className="text-xl sm:text-2xl font-bold text-white">{isLoading ? '...' : formatCurrency(totalExpense)}</div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* Tabs */}
                        <div className="bg-white p-1.5 rounded-2xl flex items-center mb-6 shadow-sm border border-slate-100">
                            <button
                                onClick={() => setActiveTab('transactions')}
                                className={`flex-1 py-3 px-4 rounded-xl text-[15px] font-semibold transition-all duration-300 flex justify-center items-center gap-2 ${
                                    activeTab === 'transactions' 
                                    ? 'bg-teal-50 text-teal-700 shadow-sm' 
                                    : 'text-slate-500 hover:text-teal-600 hover:bg-slate-50'
                                }`}
                            >
                                <Icons.ReceiptText size={18}/> লেনদেন
                            </button>
                            <button
                                onClick={() => setActiveTab('debts')}
                                className={`flex-1 py-3 px-4 rounded-xl text-[15px] font-semibold transition-all duration-300 flex justify-center items-center gap-2 ${
                                    activeTab === 'debts' 
                                    ? 'bg-cyan-50 text-cyan-700 shadow-sm' 
                                    : 'text-slate-500 hover:text-cyan-600 hover:bg-slate-50'
                                }`}
                            >
                                <Icons.HandCoins size={18}/> দেনা-পাওনা
                            </button>
                        </div>

                        {/* Content: Transactions */}
                        {activeTab === 'transactions' && (
                            <section className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="flex items-center justify-between mb-4 px-2">
                                    <h2 className="text-lg font-bold text-slate-800">সাম্প্রতিক লেনদেন</h2>
                                    <button onClick={() => setIsTransactionModalOpen(true)} className="text-white font-semibold text-sm bg-teal-500 shadow-sm shadow-teal-500/20 hover:bg-teal-600 px-5 py-2 rounded-full transition-all flex items-center gap-1.5">
                                        <Icons.Plus size={16} strokeWidth="2" /> যোগ
                                    </button>
                                </div>

                                {isLoading ? (
                                    <div className="text-center py-16"><Icons.Loader size={32} className="mx-auto text-teal-400 mb-2" /></div>
                                ) : transactions.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-[2rem] border border-slate-100 shadow-sm">
                                        <div className="w-16 h-16 bg-slate-50 text-teal-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
                                            <Icons.ReceiptText size={32} />
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-700">কোনো লেনদেন পাওয়া যায়নি</h3>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {transactions.map((t) => (
                                            <div key={t.id} className="bg-white p-4 sm:p-5 rounded-[1.25rem] border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 flex items-center justify-between group">
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-12 h-12 flex items-center justify-center rounded-xl ${t.type === 'income' ? 'bg-teal-50 text-teal-600' : 'bg-rose-50 text-rose-500'}`}>
                                                        {t.type === 'income' ? <Icons.ArrowUpRight size={22} /> : <Icons.ArrowDownRight size={22} />}
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-slate-800 text-base">{t.description}</p>
                                                        <p className="text-xs text-slate-500 font-medium mt-0.5 flex items-center gap-1"><Icons.CalendarDays size={12}/> {formatDate(t.date)}</p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className={`font-bold text-lg tracking-tight ${t.type === 'income' ? 'text-teal-600' : 'text-slate-800'}`}>
                                                        {t.type === 'income' ? '+' : '-'}{formatCurrency(t.amount)}
                                                    </span>
                                                    <button onClick={() => deleteTransaction(t.id)} className="w-9 h-9 flex items-center justify-center text-slate-300 hover:text-white hover:bg-rose-500 rounded-xl transition-all sm:opacity-0 sm:group-hover:opacity-100">
                                                        <Icons.Trash2 size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        )}

                        {/* Content: Debts */}
                        {activeTab === 'debts' && (
                            <section className="animate-in fade-in slide-in-from-bottom-4 duration-500">
                                <div className="grid grid-cols-2 gap-4 sm:gap-5 mb-6">
                                    <div className="bg-white p-5 sm:p-6 rounded-[1.5rem] border border-slate-100 shadow-sm">
                                        <div className="w-10 h-10 rounded-[0.8rem] bg-cyan-50 text-cyan-600 flex items-center justify-center mb-3">
                                            <Icons.ArrowDownRight size={20} />
                                        </div>
                                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">আমি পাবো</p>
                                        <p className="text-2xl font-bold text-cyan-700">{isLoading ? '...' : formatCurrency(totalOwedToMe)}</p>
                                    </div>
                                    <div className="bg-white p-5 sm:p-6 rounded-[1.5rem] border border-slate-100 shadow-sm">
                                        <div className="w-10 h-10 rounded-[0.8rem] bg-rose-50 text-rose-500 flex items-center justify-center mb-3">
                                           <Icons.ArrowUpRight size={20} />
                                        </div>
                                        <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">আমি দেবো</p>
                                        <p className="text-2xl font-bold text-rose-600">{isLoading ? '...' : formatCurrency(totalIOwe)}</p>
                                    </div>
                                </div>

                                <div className="flex items-center justify-between mb-4 px-2">
                                    <h2 className="text-lg font-bold text-slate-800">বর্তমান রেকর্ড</h2>
                                    <button onClick={() => setIsDebtModalOpen(true)} className="text-white font-semibold text-sm bg-cyan-500 shadow-sm shadow-cyan-500/20 hover:bg-cyan-600 px-5 py-2 rounded-full transition-all flex items-center gap-1.5">
                                        <Icons.Plus size={16} /> যোগ
                                    </button>
                                </div>

                                {isLoading ? (
                                    <div className="text-center py-16"><Icons.Loader size={32} className="mx-auto text-cyan-400 mb-2" /></div>
                                ) : debts.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-[2rem] border border-slate-100 shadow-sm">
                                        <div className="w-16 h-16 bg-slate-50 text-cyan-400 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-100">
                                            <Icons.HandCoins size={32} />
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-700">সব হিসেব পরিষ্কার!</h3>
                                    </div>
                                ) : (
                                    <div className="space-y-3">
                                        {debts.map((d) => (
                                            <div key={d.id} className="bg-white p-4 sm:p-5 rounded-[1.25rem] border border-slate-100 shadow-sm hover:shadow-md transition-all duration-300 flex items-center justify-between group">
                                                <div className="flex items-center gap-4">
                                                    <div className="w-12 h-12 flex items-center justify-center rounded-xl bg-slate-50 text-slate-500">
                                                        <Icons.Users size={22} />
                                                    </div>
                                                    <div>
                                                        <p className="font-semibold text-slate-800 text-base">{d.person}</p>
                                                        <p className="text-xs text-slate-500 font-medium mt-0.5 truncate max-w-[140px] sm:max-w-xs">
                                                            {d.description || (d.type === 'receivable' ? 'দেনাদার' : 'পাওনাদার')} • {formatDate(d.date)}
                                                        </p>
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-right">
                                                        <span className={`block font-bold text-lg tracking-tight ${d.type === 'receivable' ? 'text-cyan-600' : 'text-rose-500'}`}>
                                                            {formatCurrency(d.amount)}
                                                        </span>
                                                        <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-md inline-block mt-1 ${d.type === 'receivable' ? 'bg-cyan-50 text-cyan-700' : 'bg-rose-50 text-rose-600'}`}>
                                                           {d.type === 'receivable' ? 'পাবো' : 'দেবো'}
                                                        </span>
                                                    </div>
                                                    <button onClick={() => deleteDebt(d.id)} className="w-9 h-9 flex items-center justify-center text-slate-300 hover:text-white hover:bg-rose-500 rounded-xl transition-all sm:opacity-0 sm:group-hover:opacity-100 ml-1">
                                                        <Icons.Trash2 size={16} />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="w-full max-w-2xl mx-auto px-5 py-6 text-center text-slate-400 font-medium text-sm mt-auto">
                        <p>© {new Date().getFullYear()} হিসেবপাতি।</p>
                    </footer>

                    {isTransactionModalOpen && <TransactionModal />}
                    {isDebtModalOpen && <DebtModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
