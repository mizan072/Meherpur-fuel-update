<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>হিসেবপাতি - পরিষ্কার আর্থিক চিত্র</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="হিসেবপাতি">
    <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIiIGZpbGw9IiM2MzY2ZjEiPjxyZWN0IHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiByeD0iMTI4Ii8+PHBhdGggZD0iTTI1NiAxNDRsMTEyIDExMmgtODF2MTEyaC02MlYyNTZIMTQ0TDI1NiAxNDR6IiBmaWxsPSIjZmZmIi8+PC9zdmc+">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Hind Siliguri', 'sans-serif'] },
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        @keyframes spin-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin-slow 2s linear infinite; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-700 selection:bg-indigo-100 pb-safe">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ------------------ GOOGLE SHEET API URL ------------------
        const API_URL = "https://script.google.com/macros/s/AKfycbxOCNPoQ4LhqQL5IbOu8eRxVhd9ZK8zX9Hwf4wjCfEBUsZcNJ3Cqx4W-YvmMfBs_QTM1A/exec";

        // --- SVG Icons ---
        const SvgIcon = ({ size = 24, strokeWidth = 2, className = "", children }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                {children}
            </svg>
        );

        const Icons = {
            Activity: (p) => <SvgIcon {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></SvgIcon>,
            Wallet: (p) => <SvgIcon {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></SvgIcon>,
            Bell: (p) => <SvgIcon {...p}><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></SvgIcon>,
            ArrowUpRight: (p) => <SvgIcon {...p}><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></SvgIcon>,
            ArrowDownRight: (p) => <SvgIcon {...p}><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></SvgIcon>,
            ReceiptText: (p) => <SvgIcon {...p}><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M14 8H8"/><path d="M16 12H8"/><path d="M13 16H8"/></SvgIcon>,
            HandCoins: (p) => <SvgIcon {...p}><path d="M11 15h2a2 2 0 1 0 0-4h-3c-1 0-2-1-2-2s1-2 2-2h3"/><path d="M11 15v2"/><path d="M13 7v2"/><path d="M14.99 18a8.87 8.87 0 0 1-5.61-2l-1.39-1.4c-1.35-1.35-3.38-1.52-4.93-.41a2 2 0 0 0-.41 3.03l6.57 6.64A8.87 8.87 0 0 0 14.99 24"/><path d="M14.99 18h7.62a1.39 1.39 0 0 0 1.29-1.92L21 9"/></SvgIcon>,
            Plus: (p) => <SvgIcon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></SvgIcon>,
            Trash2: (p) => <SvgIcon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SvgIcon>,
            Edit2: (p) => <SvgIcon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></SvgIcon>,
            Search: (p) => <SvgIcon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></SvgIcon>,
            CalendarDays: (p) => <SvgIcon {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></SvgIcon>,
            Users: (p) => <SvgIcon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></SvgIcon>,
            User: (p) => <SvgIcon {...p}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></SvgIcon>,
            X: (p) => <SvgIcon {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></SvgIcon>,
            FileText: (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></SvgIcon>,
            Lock: (p) => <SvgIcon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></SvgIcon>,
            LogOut: (p) => <SvgIcon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></SvgIcon>,
            Filter: (p) => <SvgIcon {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></SvgIcon>,
            ChartBar: (p) => <SvgIcon {...p}><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></SvgIcon>,
            TrendingUp: (p) => <SvgIcon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></SvgIcon>,
            Loader: (p) => <SvgIcon {...p} className={`animate-spin-slow ${p.className || ""}`}><path d="M21 12a9 9 0 1 1-6.219-8.56"/></SvgIcon>,
            CheckCircle: (p) => <SvgIcon {...p}><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></SvgIcon>
        };

        function App() {
            // --- State ---
            const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('isAuth') === 'true');
            const [serverPassword, setServerPassword] = useState(null);
            const [inputPassword, setInputPassword] = useState("");
            const [loginError, setLoginError] = useState("");

            const [activeTab, setActiveTab] = useState('transactions'); 
            const [txSort, setTxSort] = useState('date-desc'); 
            const [reportTab, setReportTab] = useState('overview'); 
            
            const [searchQuery, setSearchQuery] = useState("");
            const [txPage, setTxPage] = useState(1);
            const ITEMS_PER_PAGE = 10;

            const [isTransactionModalOpen, setIsTransactionModalOpen] = useState(false);
            const [isDebtModalOpen, setIsDebtModalOpen] = useState(false);
            const [editingTransaction, setEditingTransaction] = useState(null);
            const [editingDebt, setEditingDebt] = useState(null);
            
            const [transactions, setTransactions] = useState([]);
            const [debts, setDebts] = useState([]);
            
            const [isLoading, setIsLoading] = useState(true);
            const [isSaving, setIsSaving] = useState(false);
            const [apiError, setApiError] = useState("");

            // --- Fetch Data ---
            const fetchData = async () => {
                setIsLoading(true);
                setApiError("");
                try {
                    const response = await fetch(API_URL);
                    const text = await response.text();
                    try {
                        const data = JSON.parse(text);
                        setServerPassword(data.appPassword || "");
                        setTransactions(data.transactions || []);
                        setDebts(data.debts || []);
                    } catch (parseError) {
                        setApiError("গুগল শিট থেকে ডেটা লোড করা যাচ্ছে না।");
                    }
                } catch (error) {
                    setApiError("ইন্টারনেট সংযোগ বা সার্ভার সমস্যা।");
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            useEffect(() => {
                setTxPage(1);
            }, [searchQuery, txSort, activeTab]);

            // --- Authentication ---
            const handleLogin = (e) => {
                e.preventDefault();
                if (inputPassword === serverPassword) {
                    setIsAuthenticated(true);
                    localStorage.setItem('isAuth', 'true');
                    setLoginError("");
                } else {
                    setLoginError("পাসওয়ার্ডটি ভুল হয়েছে!");
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                localStorage.removeItem('isAuth');
                setInputPassword("");
            };

            // --- Helper API Call ---
            const postToGoogleSheet = async (action, data) => {
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, data })
                    });
                } catch (error) {
                    alert("ডেটা সংরক্ষণ করতে সমস্যা হয়েছে!");
                }
            };

            // --- Calculations ---
            const { totalIncome, totalExpense, balance } = useMemo(() => {
                let inc = 0, exp = 0;
                transactions.forEach(t => {
                    if (t.type === 'income') inc += t.amount;
                    else exp += t.amount;
                });
                return { totalIncome: inc, totalExpense: exp, balance: inc - exp };
            }, [transactions]);

            const { totalOwedToMe, totalIOwe } = useMemo(() => {
                let owed = 0, iOwe = 0;
                debts.forEach(d => {
                    const remaining = d.amount - (d.paidAmount || 0);
                    if (remaining > 0) {
                        if (d.type === 'receivable') owed += remaining;
                        else iOwe += remaining;
                    }
                });
                return { totalOwedToMe: owed, totalIOwe: iOwe };
            }, [debts]);

            // --- Sorting & Searching Logic ---
            const sortedAndFilteredTransactions = useMemo(() => {
                let result = [...transactions];
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(t => t.description.toLowerCase().includes(q) || t.amount.toString().includes(q));
                }
                if (txSort === 'filter-income') {
                    result = result.filter(t => t.type === 'income').sort((a, b) => new Date(b.date) - new Date(a.date));
                } else if (txSort === 'filter-expense') {
                    result = result.filter(t => t.type === 'expense').sort((a, b) => new Date(b.date) - new Date(a.date));
                } else if (txSort === 'date-desc') {
                    result.sort((a, b) => new Date(b.date) - new Date(a.date));
                } else if (txSort === 'date-asc') {
                    result.sort((a, b) => new Date(a.date) - new Date(b.date));
                } else if (txSort === 'amount-desc') {
                    result.sort((a, b) => b.amount - a.amount);
                } else if (txSort === 'amount-asc') {
                    result.sort((a, b) => a.amount - b.amount);
                }
                return result;
            }, [transactions, txSort, searchQuery]);

            const totalTxPages = Math.ceil(sortedAndFilteredTransactions.length / ITEMS_PER_PAGE);
            const currentTxList = useMemo(() => {
                const startIndex = (txPage - 1) * ITEMS_PER_PAGE;
                return sortedAndFilteredTransactions.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            }, [sortedAndFilteredTransactions, txPage]);

            const filteredDebts = useMemo(() => {
                let result = [...debts];
                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    result = result.filter(d => 
                        d.person.toLowerCase().includes(q) || 
                        d.description.toLowerCase().includes(q) || 
                        d.amount.toString().includes(q)
                    );
                }
                return result;
            }, [debts, searchQuery]);

            // --- Report Helpers ---
            const topExpenses = useMemo(() => {
                const expenses = transactions.filter(t => t.type === 'expense');
                const grouped = expenses.reduce((acc, curr) => {
                    acc[curr.description] = (acc[curr.description] || 0) + curr.amount;
                    return acc;
                }, {});
                return Object.entries(grouped).sort((a, b) => b[1] - a[1]).slice(0, 3);
            }, [transactions]);

            const groupTransactionsByMonth = (type) => {
                const filtered = transactions.filter(t => t.type === type).sort((a, b) => new Date(b.date) - new Date(a.date));
                const groups = {};
                filtered.forEach(t => {
                    const dateObj = new Date(t.date);
                    const monthYear = dateObj.toLocaleDateString('bn-BD', { month: 'long', year: 'numeric' });
                    if (!groups[monthYear]) groups[monthYear] = { total: 0, items: [] };
                    groups[monthYear].total += t.amount;
                    groups[monthYear].items.push(t);
                });
                return groups;
            };

            // --- Handlers (Add/Edit/Delete) ---
            const handleSaveTransaction = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const formData = new FormData(e.target);
                
                const newTransaction = {
                    id: editingTransaction ? editingTransaction.id : Date.now().toString(),
                    type: formData.get('type'),
                    amount: parseFloat(formData.get('amount')),
                    description: formData.get('description'),
                    date: formData.get('date'),
                };
                
                if (editingTransaction) {
                    setTransactions(transactions.map(t => t.id === newTransaction.id ? newTransaction : t));
                    setIsTransactionModalOpen(false);
                    await postToGoogleSheet("updateTransaction", newTransaction);
                } else {
                    setTransactions([newTransaction, ...transactions]);
                    setIsTransactionModalOpen(false);
                    await postToGoogleSheet("addTransaction", newTransaction);
                }
                setIsSaving(false);
                setEditingTransaction(null);
            };

            const handleSaveDebt = async (e) => {
                e.preventDefault();
                setIsSaving(true);
                const formData = new FormData(e.target);
                
                const newDebt = {
                    id: editingDebt ? editingDebt.id : Date.now().toString(),
                    type: formData.get('type'),
                    person: formData.get('person'),
                    amount: parseFloat(formData.get('amount')),
                    description: formData.get('description'),
                    date: formData.get('date'),
                    paidAmount: parseFloat(formData.get('paidAmount')) || 0,
                };
                
                if (editingDebt) {
                    setDebts(debts.map(d => d.id === newDebt.id ? newDebt : d));
                    setIsDebtModalOpen(false);
                    await postToGoogleSheet("updateDebt", newDebt);
                } else {
                    setDebts([newDebt, ...debts]);
                    setIsDebtModalOpen(false);
                    await postToGoogleSheet("addDebt", newDebt);
                }
                setIsSaving(false);
                setEditingDebt(null);
            };

            const deleteTransaction = async (id) => {
                if(!confirm("আপনি কি নিশ্চিত যে এই রেকর্ডটি মুছে ফেলতে চান?")) return;
                setTransactions(transactions.filter(t => t.id !== id));
                await postToGoogleSheet("deleteTransaction", { id });
            };

            const deleteDebt = async (id) => {
                if(!confirm("আপনি কি নিশ্চিত যে এই রেকর্ডটি মুছে ফেলতে চান?")) return;
                setDebts(debts.filter(d => d.id !== id));
                await postToGoogleSheet("deleteDebt", { id });
            };

            const openEditTransaction = (transaction) => {
                setEditingTransaction(transaction);
                setIsTransactionModalOpen(true);
            };

            const openEditDebt = (debt) => {
                setEditingDebt(debt);
                setIsDebtModalOpen(true);
            };

            const formatCurrency = (amount) => {
                return new Intl.NumberFormat('bn-BD', { style: 'currency', currency: 'BDT', minimumFractionDigits: 0 }).format(amount);
            };

            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString('bn-BD', { month: 'short', day: 'numeric', year: 'numeric' });
            };

            // ==========================================
            // FULL SCREEN LOADING STATE
            // ==========================================
            if (isLoading && !serverPassword && !apiError) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center">
                        <Icons.Loader size={48} strokeWidth="1.5" className="text-indigo-500 mb-4" />
                        <p className="text-slate-500 font-semibold animate-pulse">ডেটা লোড হচ্ছে...</p>
                    </div>
                );
            }

            // ==========================================
            // LOCK SCREEN
            // ==========================================
            if (serverPassword && !isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-4">
                        <div className="bg-white p-8 rounded-[2rem] shadow-xl shadow-indigo-100/50 border border-slate-100 w-full max-w-sm text-center">
                            <div className="w-16 h-16 bg-indigo-50 text-indigo-500 rounded-2xl flex items-center justify-center mx-auto mb-5">
                                <Icons.Lock size={32} />
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 mb-2">হিসেবপাতি</h2>
                            <p className="text-slate-500 text-sm font-medium mb-8">অ্যাপটি আনলক করতে পাসওয়ার্ড দিন</p>
                            
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div className="relative">
                                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icons.Lock size={18} /></span>
                                    <input 
                                        type="password" 
                                        value={inputPassword}
                                        onChange={(e) => setInputPassword(e.target.value)}
                                        required 
                                        placeholder="পাসওয়ার্ড" 
                                        className="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition-all font-medium text-slate-800 text-center tracking-widest" 
                                    />
                                </div>
                                {loginError && <p className="text-rose-500 text-sm font-semibold">{loginError}</p>}
                                <button type="submit" className="w-full bg-indigo-500 text-white py-3.5 rounded-2xl font-bold text-lg hover:bg-indigo-600 active:scale-[0.98] transition-all mt-2 shadow-sm shadow-indigo-500/20">
                                    আনলক করুন
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // MODALS
            // ==========================================
            const TransactionModal = () => (
                <div className="fixed inset-0 bg-slate-800/20 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
                    <div className="bg-white rounded-t-[2rem] sm:rounded-[2rem] w-full max-w-md overflow-hidden shadow-2xl animate-in slide-in-from-bottom-full duration-300 max-h-[90vh] overflow-y-auto border border-slate-100">
                        <div className="sticky top-0 bg-white/95 backdrop-blur-md flex justify-between items-center p-6 border-b border-slate-100 z-10">
                            <h2 className="text-xl font-bold text-slate-800">{editingTransaction ? "লেনদেন এডিট" : "নতুন লেনদেন"}</h2>
                            <button onClick={() => {setIsTransactionModalOpen(false); setEditingTransaction(null);}} className="p-2 bg-slate-50 text-slate-400 hover:text-slate-800 hover:bg-slate-100 rounded-full transition-all">
                                <Icons.X size={20} strokeWidth="2" />
                            </button>
                        </div>
                        <form key={editingTransaction ? editingTransaction.id : 'new-tx'} onSubmit={handleSaveTransaction} className="p-6 space-y-5">
                            <div>
                                <label className="block text-sm font-semibold text-slate-600 mb-2">ধরন</label>
                                <div className="grid grid-cols-2 gap-3 bg-slate-50 p-1.5 rounded-2xl border border-slate-100">
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="expense" defaultChecked={editingTransaction ? editingTransaction.type === 'expense' : true} className="peer sr-only" />
                                        <div className="flex items-center justify-center gap-2 py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-rose-500 peer-checked:text-white peer-checked:shadow-sm transition-all">
                                            <Icons.ArrowDownRight size={18} /> খরচ
                                        </div>
                                    </label>
                                    <label className="cursor-pointer">
                                        <input type="radio" name="type" value="income" defaultChecked={editingTransaction?.type === 'income'} className="peer sr-only" />
                                        <div className="flex items-center justify-center gap-2 py-3.5 rounded-xl text-slate-500 font-semibold peer-checked:bg-emerald-500 peer-checked:text-white peer-checked:shadow-sm transition-all">
                                            <Icons.ArrowUpRight size={18} /> আয়
                                        </div>
                                    </label>

                                                        </div>
                                                        <div>
                                                            <p className="font-semibold text-slate-800 text-[15px] sm:text-base leading-tight">{d.person}</p>
                                                            <div className="text-xs text-slate-500 font-medium mt-1 flex flex-wrap items-center gap-1.5">
                                                                <span className="truncate max-w-[120px] sm:max-w-[200px]">
                                                                    {d.description || (d.type === 'receivable' ? 'দেনাদার' : 'পাওনাদার')} • {formatDate(d.date)}
                                                                </span>
                                                                {(isPartial || isPaid) && (
                                                                    <span className="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-[10px]">
                                                                        মোট: {formatCurrency(d.amount)}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-2">
                                                        <div className="text-right mr-1">
                                                            {isPaid ? (
                                                                <span className="block font-bold text-base sm:text-lg tracking-tight text-emerald-500">পরিশোধিত</span>
                                                            ) : (
                                                                <span className={`block font-bold text-base sm:text-lg tracking-tight whitespace-nowrap ${d.type === 'receivable' ? 'text-indigo-600' : 'text-rose-500'}`}>
                                                                    {formatCurrency(remaining)}
                                                                </span>
                                                            )}
                                                            
                                                            {isPartial ? (
                                                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md inline-block mt-0.5 bg-amber-50 text-amber-600">
                                                                    আংশিক (পেইড: {formatCurrency(d.paidAmount)})
                                                                </span>
                                                            ) : isPaid ? (
                                                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-md inline-block mt-0.5 bg-emerald-50 text-emerald-600">
                                                                    সম্পূর্ণ
                                                                </span>
                                                            ) : (
                                                                <span className={`text-[10px] font-semibold px-2 py-0.5 rounded-md inline-block mt-0.5 ${d.type === 'receivable' ? 'bg-indigo-50 text-indigo-700' : 'bg-rose-50 text-rose-600'}`}>
                                                                {d.type === 'receivable' ? 'বাকি পাবো' : 'বাকি দেবো'}
                                                                </span>
                                                            )}
                                                        </div>
                                                        <div className="flex items-center bg-slate-50 border border-slate-100 rounded-xl overflow-hidden shadow-sm">
                                                            <button type="button" onClick={(e) => { e.stopPropagation(); openEditDebt(d); }} className="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 transition-all">
                                                                <Icons.Edit2 size={16} />
                                                            </button>
                                                            <div className="w-px h-5 bg-slate-200"></div>
                                                            <button type="button" onClick={(e) => { e.stopPropagation(); deleteDebt(d.id); }} className="w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-all">
                                                                <Icons.Trash2 size={16} />
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </section>
                        )}

                        {/* Content: Report / Analytics */}
                        {activeTab === 'report' && (
                            <section className="animate-in fade-in slide-in-from-bottom-4 duration-500 space-y-6">
                                
                                {/* Report Sub-tabs */}
                                <div className="bg-white p-1.5 rounded-2xl flex items-center shadow-sm border border-slate-200">
                                    <button 
                                        onClick={() => setReportTab('overview')} 
                                        className={`flex-1 py-2 px-2 rounded-xl text-[14px] font-semibold transition-all ${reportTab === 'overview' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-500 hover:text-indigo-600'}`}
                                    >
                                        সার্বিক
                                    </button>
                                    <button 
                                        onClick={() => setReportTab('income')} 
                                        className={`flex-1 py-2 px-2 rounded-xl text-[14px] font-semibold transition-all ${reportTab === 'income' ? 'bg-emerald-50 text-emerald-700' : 'text-slate-500 hover:text-emerald-600'}`}
                                    >
                                        আয়
                                    </button>
                                    <button 
                                        onClick={() => setReportTab('expense')} 
                                        className={`flex-1 py-2 px-2 rounded-xl text-[14px] font-semibold transition-all ${reportTab === 'expense' ? 'bg-rose-50 text-rose-700' : 'text-slate-500 hover:text-rose-600'}`}
                                    >
                                        ব্যয়
                                    </button>
                                </div>

                                {/* Overview Tab */}
                                {reportTab === 'overview' && (
                                    <>
                                        <div className="bg-white p-6 rounded-[1.5rem] border border-slate-200 shadow-sm animate-in fade-in">
                                            <div className="flex items-center gap-2 mb-4">
                                                <Icons.TrendingUp size={20} className="text-indigo-500" />
                                                <h2 className="text-lg font-bold text-slate-800">আয় বনাম ব্যয়</h2>
                                            </div>
                                            
                                            {totalIncome === 0 && totalExpense === 0 ? (
                                                <p className="text-slate-500 text-sm py-4 text-center font-medium">এখনো কোনো ডেটা নেই</p>
                                            ) : (
                                                <>
                                                    <div className="flex justify-between text-sm font-semibold mb-2">
                                                        <span className="text-emerald-600">আয় {((totalIncome / (totalIncome + totalExpense)) * 100).toFixed(0)}%</span>
                                                        <span className="text-rose-500">ব্যয় {((totalExpense / (totalIncome + totalExpense)) * 100).toFixed(0)}%</span>
                                                    </div>
                                                    <div className="w-full h-3 bg-slate-100 rounded-full flex overflow-hidden">
                                                        <div className="h-full bg-emerald-500 transition-all duration-1000" style={{ width: `${(totalIncome / (totalIncome + totalExpense)) * 100}%` }}></div>
                                                        <div className="h-full bg-rose-500 transition-all duration-1000" style={{ width: `${(totalExpense / (totalIncome + totalExpense)) * 100}%` }}></div>
                                                    </div>
                                                </>
                                            )}
                                        </div>

                                        <div className="bg-white p-6 rounded-[1.5rem] border border-slate-200 shadow-sm animate-in fade-in">
                                            <div className="flex items-center justify-between mb-5">
                                                <div className="flex items-center gap-2">
                                                    <Icons.ChartBar size={20} className="text-indigo-500" />
                                                    <h2 className="text-lg font-bold text-slate-800">সর্বোচ্চ ব্যয়ের খাত (Top 3)</h2>
                                                </div>
                                            </div>

                                            {topExpenses.length === 0 ? (
                                                <p className="text-slate-500 text-sm text-center py-4 font-medium">কোনো ব্যয়ের রেকর্ড নেই</p>
                                            ) : (
                                                <div className="space-y-4">
                                                    {topExpenses.map(([desc, amount], idx) => (
                                                        <div key={idx} className="flex flex-col gap-1.5">
                                                            <div className="flex justify-between items-end">
                                                                <span className="text-[15px] font-semibold text-slate-700 truncate pr-4">{desc}</span>
                                                                <span className="text-[15px] font-bold text-rose-500">{formatCurrency(amount)}</span>
                                                            </div>
                                                            <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                                                <div className="h-full bg-rose-400 rounded-full" style={{ width: `${(amount / totalExpense) * 100}%` }}></div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}

                                {/* Income Tab */}
                                {reportTab === 'income' && (
                                    <div className="animate-in fade-in">
                                        {Object.keys(groupTransactionsByMonth('income')).length === 0 ? (
                                            <div className="text-center py-10 bg-white rounded-[1.5rem] border border-slate-200 shadow-sm">
                                                <p className="text-slate-500 font-medium">কোনো আয়ের রেকর্ড পাওয়া যায়নি</p>
                                            </div>
                                        ) : (
                                            Object.entries(groupTransactionsByMonth('income')).map(([month, data]) => (
                                                <div key={month} className="bg-white p-5 rounded-[1.5rem] border border-slate-200 shadow-sm mb-4">
                                                    <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                                        <h3 className="font-bold text-slate-800">{month}</h3>
                                                        <span className="font-bold text-emerald-600">+{formatCurrency(data.total)}</span>
                                                    </div>
                                                    <div className="space-y-3">
                                                        {data.items.map(t => (
                                                            <div key={t.id} className="flex justify-between items-center">
                                                                <div>
                                                                    <p className="font-semibold text-slate-700 text-sm">{t.description}</p>
                                                                    <p className="text-[11px] text-slate-500">{formatDate(t.date)}</p>
                                                                </div>
                                                                <span className="font-semibold text-slate-800 text-sm">{formatCurrency(t.amount)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {/* Expense Tab */}
                                {reportTab === 'expense' && (
                                    <div className="animate-in fade-in">
                                        {Object.keys(groupTransactionsByMonth('expense')).length === 0 ? (
                                            <div className="text-center py-10 bg-white rounded-[1.5rem] border border-slate-200 shadow-sm">
                                                <p className="text-slate-500 font-medium">কোনো ব্যয়ের রেকর্ড পাওয়া যায়নি</p>
                                            </div>
                                        ) : (
                                            Object.entries(groupTransactionsByMonth('expense')).map(([month, data]) => (
                                                <div key={month} className="bg-white p-5 rounded-[1.5rem] border border-slate-200 shadow-sm mb-4">
                                                    <div className="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                                                        <h3 className="font-bold text-slate-800">{month}</h3>
                                                        <span className="font-bold text-rose-500">-{formatCurrency(data.total)}</span>
                                                    </div>
                                                    <div className="space-y-3">
                                                        {data.items.map(t => (
                                                            <div key={t.id} className="flex justify-between items-center">
                                                                <div>
                                                                    <p className="font-semibold text-slate-700 text-sm">{t.description}</p>
                                                                    <p className="text-[11px] text-slate-500">{formatDate(t.date)}</p>
                                                                </div>
                                                                <span className="font-semibold text-slate-800 text-sm">{formatCurrency(t.amount)}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}
                            </section>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="w-full max-w-2xl mx-auto px-5 py-6 text-center text-slate-400 font-medium text-sm mt-auto">
                        <p>© {new Date().getFullYear()} হিসেবপাতি।</p>
                    </footer>

                    {isTransactionModalOpen && <TransactionModal />}
                    {isDebtModalOpen && <DebtModal />}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
