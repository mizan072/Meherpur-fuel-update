<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="brand">
      <img src="image/profile.jpg" alt="Nur Khan" style="width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:top center;border:2px solid #cc785c;flex-shrink:0;">
      <span class="brand-name">NurVai</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      নতুন chat
    </button>
  </div>

  <div class="sidebar-section">MODES</div>
  <div class="mode-list" style="flex: 0 0 auto;">
    <div class="mode-item active" onclick="setMode(this,'normal')"><span class="m-icon">💬</span> Normal Chat</div>
    <div class="mode-item" data-mode="islamic" onclick="setMode(this,'islamic')" style="display:flex;align-items:center;justify-content:space-between;">
      <span><span class="m-icon">☪️</span> Islamic AI</span>
    </div>
    <div class="mode-item" onclick="setMode(this,'study')" style="display:flex;align-items:center;justify-content:space-between;">
      <span><span class="m-icon">📚</span> Study Helper</span>
    </div>
    <div class="mode-item" onclick="setMode(this,'friendly')"><span class="m-icon">🥸</span> Friendly Mode</div>
    <div class="mode-item" onclick="setMode(this,'motivate')"><span class="m-icon">😇</span> Motivate Mode</div>
    <div class="mode-item" onclick="setMode(this,'professional')"><span class="m-icon">💼</span> Professional Mode</div>
  </div>

  <div class="sidebar-section" style="margin-top:8px;">Recents</div>
  <div class="history-list" id="historyList">
    <div style="padding:8px 16px;font-size:12px;color:var(--text-muted);font-family:Sora,sans-serif;">কোনো chat নেই</div>

<div class="main">
  <div class="topbar">

    </div>
  </div>

  <div id="modelDropdown" style="display:none;"></div>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">

      <div class="w-credit">NurVai এ স্বাগতম — তোমার বাংলা AI সঙ্গী</div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-box" id="inputBox">
      <input type="file" id="fileInput" accept="image/*,.pdf,.txt" style="display:none" onchange="handleFileSelect(event)">
      <div id="filePreviewArea" class="inline-preview-area" style="display:none;"></div>
      <textarea id="userInput" rows="1" placeholder="কিছু জিজ্ঞেস করো..." onkeydown="handleKey(event)" oninput="resize(this)"></textarea>

      <div class="input-bottom-row">
        <div class="input-bottom-left">
          <button class="plus-btn" id="plusBtn" onclick="togglePlusMenu()" title="ফাইল যোগ করো">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          
          <div class="plus-menu" id="plusMenu" style="display:none">
            <div class="plus-menu-item" onclick="openPhotos()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              Photos
            </div>
            <div class="plus-menu-item" onclick="openFiles()">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
              Files
            </div>
          </div>
        </div>
        <div class="input-bottom-right">
          <button class="mic-btn" id="micBtn" onclick="toggleVoice()" title="ভয়েস দিয়ে বলো">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
          </button>
          <button class="send-btn" id="sendBtn" onclick="send()">
            <svg viewBox="0 0 24 24" fill="white"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
          </button>
        </div>
      </div>
    </div>
    <div class="input-hint" id="inputHint">Enter → পাঠাও &nbsp;|&nbsp; Shift+Enter → নতুন লাইন</div>
  </div>
</div>

<script>
window.renderMath = function(element) {
  if (typeof renderMathInElement === 'undefined') return;
  renderMathInElement(element || document.getElementById('chat'), {
    delimiters: [
      {left: '$$', right: '$$', display: true},
      {left: '$', right: '$', display: false},
      {left: '\\(', right: '\\)', display: false},
      {left: '\\[', right: '\\]', display: true},
      {left: '\\boxed{', right: '}', display: false}
    ],
    throwOnError: false
  });
};
</script>
<script src="script.js?v=201231"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
          newSW.postMessage('skipWaiting');
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            window.location.reload();
          });
        }
      });
    });
  }).catch(e => {});
}
</script>

<script>
window._splashDone = false;
function doneSplash() {
  var splash = document.getElementById('splashScreen');
  splash.style.transition = 'opacity 0.4s ease';
  splash.style.opacity = '0';
  splash.style.pointerEvents = 'none';
  setTimeout(function() {
    splash.style.display = 'none';
    window._splashDone = true;
  }, 420);
}
setTimeout(doneSplash, 1200);
</script>
